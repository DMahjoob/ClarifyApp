<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ClarifyApp - Study Assistant</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" />
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/11.1.1/marked.min.js"></script>
<style>
  :root {
    --bg: #f2ede8;
    --surface: #ffffff;
    --surface2: #e8e2db;
    --card-bg: #f07272;
    --border: rgba(60,45,35,0.12);
    --accent: #e8185d;
    --accent-dark: #c4134f;
    --text: #2a2018;
    --text-muted: #7a6e66;
    --text-dim: #5c5048;
    --mono: 'Space Mono', monospace;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: var(--mono);
    background-color: var(--bg);
    background-image:
      linear-gradient(rgba(60,45,35,0.05) 1px, transparent 1px),
      linear-gradient(90deg, rgba(60,45,35,0.05) 1px, transparent 1px);
    background-size: 48px 48px;
    color: var(--text);
    min-height: 100vh;
  }

  nav {
    position: sticky; top: 0; z-index: 100;
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 2.5rem; height: 56px;
    background: rgba(242,237,232,0.92);
    backdrop-filter: blur(16px);
    border-bottom: 1px solid var(--border);
  }

  .nav-brand { font-size: 0.78rem; color: var(--text-dim); letter-spacing: 0.05em; }

  .nav-links { display: flex; gap: 2rem; }
  .nav-links a { font-size: 0.75rem; color: var(--text-muted); text-decoration: none; letter-spacing: 0.06em; transition: color 0.15s; }
  .nav-links a:hover { color: var(--text); }
  .nav-links a.active { color: var(--accent); }

  .page { max-width: 860px; margin: 0 auto; padding: 3rem 2rem 5rem; }

  .section-heading { font-size: clamp(1.6rem, 4vw, 2.2rem); font-weight: 700; margin-bottom: 0.4rem; color: var(--text); }
  .section-heading .pink { color: var(--accent); }
  .section-sub { font-size: 0.8rem; color: var(--text-muted); margin-bottom: 2rem; letter-spacing: 0.04em; }

  .form-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-left: 3px solid var(--accent);
    border-radius: 4px;
    padding: 1.5rem;
    margin-bottom: 1.25rem;
  }

  .class-row {
    display: flex; align-items: center; gap: 10px;
    padding-bottom: 1rem; margin-bottom: 1rem;
    border-bottom: 1px solid var(--border);
  }

  .class-select {
    flex: 1; font-family: var(--mono); font-size: 0.85rem;
    background: transparent; border: 1px solid var(--border);
    color: var(--text); padding: 7px 10px; border-radius: 4px;
    outline: none; cursor: pointer; transition: border-color 0.15s;
  }
  .class-select:focus { border-color: var(--accent); }

  .name-row {
    display: flex; align-items: center; gap: 10px;
    padding-bottom: 1rem; margin-bottom: 1rem;
    border-bottom: 1px solid var(--border);
  }

  .name-label { font-size: 0.7rem; color: var(--text-muted); letter-spacing: 0.1em; white-space: nowrap; }

  .name-input {
    flex: 1; background: transparent; border: none; outline: none;
    font-family: var(--mono); font-size: 0.85rem; color: var(--text);
  }
  .name-input::placeholder { color: var(--text-muted); }

  .textarea-wrap { position: relative; }

  .q-textarea {
    width: 100%; background: transparent; border: none; outline: none;
    font-family: var(--mono); font-size: 0.88rem; color: var(--text);
    resize: none; min-height: 90px; line-height: 1.65; padding-right: 38px;
  }
  .q-textarea::placeholder { color: var(--text-muted); }

  .mic-btn {
    position: absolute; bottom: 4px; right: 4px;
    width: 30px; height: 30px;
    background: var(--surface2); border: 1px solid var(--border); border-radius: 4px;
    color: var(--text-muted); cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.15s;
  }
  .mic-btn:hover { border-color: var(--accent); color: var(--accent); }
  .mic-btn.listening { background: rgba(232,24,93,0.08); border-color: var(--accent); color: var(--accent); animation: pulse-mic 1.2s infinite; }
  .mic-btn .material-symbols-outlined { font-size: 16px; }
  @keyframes pulse-mic { 0%,100% { box-shadow: 0 0 0 0 rgba(232,24,93,0.3); } 50% { box-shadow: 0 0 0 5px rgba(232,24,93,0); } }

  .action-row { display: flex; align-items: center; gap: 0.75rem; margin-top: 1.25rem; flex-wrap: wrap; }

  .btn {
    font-family: var(--mono); font-size: 0.77rem;
    padding: 9px 18px; border-radius: 4px; border: 1px solid transparent;
    cursor: pointer; letter-spacing: 0.05em; transition: all 0.15s;
    display: inline-flex; align-items: center; gap: 6px;
  }
  .btn .material-symbols-outlined { font-size: 15px; }

  .btn-primary { background: var(--accent); color: white; border-color: var(--accent); }
  .btn-primary:hover { background: var(--accent-dark); border-color: var(--accent-dark); transform: translateY(-1px); box-shadow: 0 4px 12px rgba(232,24,93,0.25); }

  .btn-outline { background: transparent; color: var(--text-dim); border-color: var(--border); }
  .btn-outline:hover { border-color: var(--accent); color: var(--accent); }

  .diff-select {
    font-family: var(--mono); font-size: 0.77rem;
    background: var(--surface); border: 1px solid var(--border);
    color: var(--text-dim); padding: 9px 14px; border-radius: 4px;
    outline: none; cursor: pointer; transition: border-color 0.15s;
  }
  .diff-select:focus { border-color: var(--accent); }

  .status { font-size: 0.74rem; letter-spacing: 0.06em; min-height: 22px; margin: 0.75rem 0; color: var(--text-muted); }
  .status.ok { color: #2a7a4b; }
  .status.err { color: var(--accent); }
  .status.pending { color: #b07020; }

  .cursor { font-size: 0.82rem; color: var(--text-muted); margin: 0.5rem 0 2rem; }
  .cursor::after { content: '▌'; color: var(--accent); animation: blink 1s step-end infinite; }
  @keyframes blink { 0%,100% { opacity:1; } 50% { opacity:0; } }

  /* ── RESULTS ── */
  .results-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1.25rem; }
  @media (max-width: 680px) { .results-grid { grid-template-columns: 1fr; } }

  .result-panel { display: none; border-radius: 4px; overflow: hidden; animation: fade-up 0.3s ease both; }
  .result-panel.visible { display: block; }
  .result-panel.full { grid-column: 1 / -1; }

  @keyframes fade-up { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:translateY(0); } }

  .panel-head {
    background: var(--card-bg); padding: 0.75rem 1.1rem;
    display: flex; align-items: center; justify-content: space-between;
  }
  .panel-head-title { font-size: 0.72rem; font-weight: 700; color: white; letter-spacing: 0.08em; display: flex; align-items: center; gap: 6px; }
  .panel-head-title .material-symbols-outlined { font-size: 14px; }
  .panel-count { font-size: 0.66rem; color: rgba(255,255,255,0.75); letter-spacing: 0.06em; }

  .panel-body { background: var(--surface); border: 1px solid var(--border); border-top: none; padding: 1.1rem; }

  /* slides */
  .slide-card { padding: 0.85rem 0; border-bottom: 1px solid var(--border); }
  .slide-card:last-child { border-bottom: none; }
  .slide-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; margin-bottom: 3px; }
  .slide-title { font-size: 0.82rem; font-weight: 700; color: var(--text); line-height: 1.4; }
  .score-pill { font-size: 0.64rem; color: white; background: var(--accent); border-radius: 3px; padding: 2px 7px; white-space: nowrap; flex-shrink: 0; }
  .slide-deck { font-size: 0.68rem; color: var(--text-muted); margin-bottom: 4px; }
  .slide-summary { font-size: 0.77rem; color: var(--text-dim); line-height: 1.5; margin-bottom: 5px; }
  .kw-row { display: flex; flex-wrap: wrap; gap: 4px; }
  .kw { font-size: 0.61rem; color: var(--accent); border: 1px solid rgba(232,24,93,0.3); border-radius: 3px; padding: 1px 6px; }

  /* ai answer */
  .ai-ts { font-size: 0.64rem; color: var(--text-muted); letter-spacing: 0.08em; margin-bottom: 0.6rem; }
  .ai-body { font-size: 0.82rem; line-height: 1.7; color: var(--text-dim); }
  .ai-body strong { color: var(--text); }
  .ai-body code { font-family: var(--mono); font-size: 0.8em; background: var(--surface2); border: 1px solid var(--border); border-radius: 3px; padding: 1px 5px; color: var(--accent); }
  .ai-body pre { background: var(--surface2); border: 1px solid var(--border); border-radius: 4px; padding: 0.85rem; overflow-x: auto; margin: 0.6rem 0; }
  .ai-body pre code { background: none; border: none; padding: 0; }
  .urgent { color: var(--accent); font-weight: 700; background: rgba(232,24,93,0.08); border-radius: 3px; padding: 1px 5px; }

  /* quiz */
  .quiz-q { padding: 0.85rem 0; border-bottom: 1px solid var(--border); }
  .quiz-q:last-child { border-bottom: none; }
  .quiz-num { font-size: 0.64rem; color: var(--accent); letter-spacing: 0.1em; margin-bottom: 4px; }
  .quiz-qtext { font-size: 0.82rem; color: var(--text); font-weight: 700; margin-bottom: 8px; line-height: 1.45; }
  .quiz-opt { display: flex; gap: 8px; font-size: 0.77rem; color: var(--text-dim); padding: 3px 0; }
  .quiz-opt-letter { color: var(--accent); font-weight: 700; min-width: 18px; flex-shrink: 0; }
  .quiz-ans { margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--border); font-size: 0.71rem; color: #2a7a4b; letter-spacing: 0.05em; display: none; }

  .quiz-opt-btn {
    display: flex; gap: 8px; align-items: flex-start;
    font-family: var(--mono); font-size: 0.77rem; color: var(--text-dim);
    padding: 8px 12px; margin: 4px 0;
    background: var(--surface2); border: 1px solid var(--border); border-radius: 4px;
    cursor: pointer; transition: all 0.15s; width: 100%; text-align: left;
  }
  .quiz-opt-btn:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
  .quiz-opt-btn:disabled { cursor: default; opacity: 0.85; }
  .quiz-opt-btn.correct { border-color: #2a7a4b; background: rgba(42,122,75,0.1); color: #2a7a4b; }
  .quiz-opt-btn.incorrect { border-color: var(--accent); background: rgba(232,24,93,0.08); color: var(--accent); text-decoration: line-through; }
  .quiz-opt-btn .quiz-opt-letter { color: inherit; font-weight: 700; min-width: 18px; flex-shrink: 0; }
  .quiz-result-tag { font-size: 0.68rem; font-weight: 700; letter-spacing: 0.06em; margin-top: 6px; }
  .quiz-result-tag.right { color: #2a7a4b; }
  .quiz-result-tag.wrong { color: var(--accent); }


  ::-webkit-scrollbar { width: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  @media (max-width: 600px) {
    .page { padding: 2rem 1rem 4rem; }
    .action-row { flex-direction: column; align-items: stretch; }
    .btn { justify-content: center; }
  }
</style>
</head>
<body>

<nav>
  <span class="nav-brand">ClarifyApp</span>
  <div class="nav-links">
    <a href="/" class="active">student</a>
    <a href="/professor.html">professor</a>
  </div>
</nav>

<div class="page">

  <h1 class="section-heading">What do you want to <span class="pink">clarify?</span>:</h1>
  <p class="section-sub">&gt; Responses based on course slides and materials.</p>

  <form id="questionForm">
    <div class="form-card">
      <div class="class-row">
        <span class="name-label">CLASS:</span>
        <select id="classSelect" class="class-select" required>
          <option value="" disabled selected>loading classes...</option>
        </select>
      </div>
      <div class="name-row">
        <span class="name-label">NAME (optional): </span>
        <input type="text" id="user" class="name-input" required autocomplete="off">
      </div>
      <div class="textarea-wrap">
        <textarea id="text" class="q-textarea" placeholder="Ask your question here..." required rows="4"></textarea>
        <button type="button" id="micBtn" class="mic-btn" title="Voice input">
          <span class="material-symbols-outlined" id="micIcon">mic</span>
        </button>
      </div>
    </div>

    <div class="action-row">
      <button type="submit" class="btn btn-primary">
        <span class="material-symbols-outlined">send</span>
        submit question
      </button>
      <button type="button" id="generateQuizBtn" class="btn btn-outline">
        <span class="material-symbols-outlined">quiz</span>
        generate quiz
      </button>
      <select id="difficulty" class="diff-select">
        <option value="" disabled selected>difficulty</option>
        <option value="easy">easy</option>
        <option value="medium">medium</option>
        <option value="hard">hard</option>
      </select>
    </div>
  </form>

  <p id="status" class="status"></p>
  <div class="cursor">&gt;&gt;&gt;</div>

  <div class="results-grid">
    <div id="recommendations" class="result-panel">
      <div class="panel-head">
        <div class="panel-head-title"><span class="material-symbols-outlined">library_books</span>RECOMMENDED SLIDES</div>
        <span class="panel-count" id="slideCount"></span>
      </div>
      <div class="panel-body" id="recommendationsList"></div>
    </div>

    <div id="aiAnswer" class="result-panel">
      <div class="panel-head">
        <div class="panel-head-title"><span class="material-symbols-outlined">psychology</span>AI ANSWER</div>
      </div>
      <div class="panel-body">
        <div class="ai-ts" id="aiTimestamp"></div>
        <div class="ai-body" id="aiAnswerText"></div>
      </div>
    </div>

    <div id="quizContainer" class="result-panel full">
      <div class="panel-head">
        <div class="panel-head-title"><span class="material-symbols-outlined">edit_note</span>GENERATED QUIZ</div>
        <span class="panel-count" id="quizCount"></span>
      </div>
      <div class="panel-body" id="quizContent"></div>
    </div>
  </div>

</div>


<script>
  const micBtn = document.getElementById("micBtn");
  const textArea = document.getElementById("text");
  const statusEl = document.getElementById("status");
  const micIcon = document.getElementById("micIcon");
  const recommendationsDiv = document.getElementById("recommendations");
  const recommendationsList = document.getElementById("recommendationsList");
  const aiAnswerDiv = document.getElementById("aiAnswer");
  const aiAnswerText = document.getElementById("aiAnswerText");
  const quizContainer = document.getElementById("quizContainer");
  const quizContent = document.getElementById("quizContent");
  const classSelect = document.getElementById("classSelect");

  function setStatus(msg, type='') { statusEl.textContent = '> ' + msg; statusEl.className = 'status ' + type; }

  // Load available classes on page load
  (async () => {
    try {
      const res = await fetch("/api/classes");
      const classes = await res.json();
      classSelect.innerHTML = "";
      classes.forEach((c, i) => {
        const opt = document.createElement("option");
        opt.value = c.id;
        opt.textContent = c.name;
        if (i === 0) opt.selected = true;
        classSelect.appendChild(opt);
      });
    } catch (e) {
      classSelect.innerHTML = '<option value="" disabled selected>failed to load classes</option>';
    }
  })();

  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  let recognition = null, isListening = false;
  if (SR) {
    recognition = new SR();
    recognition.lang = "en-US"; recognition.interimResults = true; recognition.continuous = true;
    let final = "";
    recognition.onstart = () => { isListening=true; micBtn.classList.add("listening"); micIcon.textContent="stop_circle"; setStatus("Listening…"); };
    recognition.onresult = (e) => {
      let interim = "";
      for (let i=e.resultIndex;i<e.results.length;i++) { const t=e.results[i][0].transcript; if(e.results[i].isFinal) final+=t+" "; else interim+=t; }
      textArea.value = final + interim;
    };
    recognition.onerror = (e) => setStatus("voice error: "+e.error,"err");
    recognition.onend = () => { isListening=false; micBtn.classList.remove("listening"); micIcon.textContent="mic"; setStatus(""); };
    micBtn.addEventListener("click", () => { if(!isListening){final=textArea.value.trim()?textArea.value+" ":"";recognition.start();}else recognition.stop(); });
  } else { micBtn.disabled=true; }

  function displayRecommendations(recs) {
    if (!recs?.length) { recommendationsDiv.classList.remove("visible"); return; }
    recommendationsList.innerHTML = "";
    document.getElementById("slideCount").textContent = recs.length + " matches";
    recs.forEach((s,i) => {
      const kws = s.keywords?.length ? `<div class="kw-row">${s.keywords.map(k=>`<span class="kw">${k}</span>`).join("")}</div>` : "";
      const card = document.createElement("div"); card.className="slide-card";
      card.innerHTML = `<div class="slide-top"><div class="slide-title">${i+1}. ${s.title}</div><div class="score-pill">${(s.score*100).toFixed(0)}%</div></div><div class="slide-deck">${s.deck_name} · slide ${s.slide_number}</div>${s.summary?`<div class="slide-summary">${s.summary}</div>`:""}${kws}`;
      recommendationsList.appendChild(card);
    });
    recommendationsDiv.classList.add("visible");
  }

  let currentQuizTopic = "";
  let currentQuizClassId = "";

  function renderQuiz(questions) {
    quizContent.innerHTML = "";
    document.getElementById("quizCount").textContent = questions.length + " questions";
    const L = ["A","B","C","D","E"];
    questions.forEach((q,i) => {
      const div = document.createElement("div"); div.className="quiz-q";
      let optsHtml = "";
      if (q.options?.length) {
        optsHtml = q.options.map((o,j) => {
          const letter = L[j];
          const cleanText = o.replace(/^[A-E]\.\s*/i,"");
          return `<button type="button" class="quiz-opt-btn" data-qi="${i}" data-letter="${letter}" data-answer="${encodeURIComponent(q.answer)}">
            <span class="quiz-opt-letter">${letter})</span><span>${cleanText}</span>
          </button>`;
        }).join("");
      }
      const ansId = `quiz-ans-${i}`;
      const ansBlock = q.answer ? `<div class="quiz-ans" id="${ansId}">>> answer: ${q.answer}</div>` : "";
      const resultTag = `<div class="quiz-result-tag" id="quiz-result-${i}"></div>`;
      div.innerHTML = `<div class="quiz-num">QUESTION ${i+1}</div><div class="quiz-qtext">${q.question}</div>${optsHtml}${ansBlock}${resultTag}`;

      // Attach click handlers to option buttons
      div.querySelectorAll(".quiz-opt-btn").forEach(btn => {
        btn.addEventListener("click", () => handleQuizAnswer(btn, q, i));
      });

      quizContent.appendChild(div);
    });
    quizContainer.classList.add("visible");
  }

  function handleQuizAnswer(btn, q, questionIndex) {
    const parent = btn.closest(".quiz-q");
    const allBtns = parent.querySelectorAll(".quiz-opt-btn");
    const selectedLetter = btn.dataset.letter;
    const correctAnswer = q.answer;

    // Determine if correct (answer could be "A", "B", etc. or the full text)
    const isCorrect = selectedLetter === correctAnswer
      || btn.querySelector("span:last-child").textContent.trim() === correctAnswer;

    // Disable all buttons
    allBtns.forEach(b => {
      b.disabled = true;
      const bLetter = b.dataset.letter;
      const bText = b.querySelector("span:last-child").textContent.trim();
      const bIsCorrect = bLetter === correctAnswer || bText === correctAnswer;
      if (bIsCorrect) b.classList.add("correct");
    });

    if (!isCorrect) btn.classList.add("incorrect");

    // Show the answer line
    const ansEl = parent.querySelector(".quiz-ans");
    if (ansEl) ansEl.style.display = "block";

    // Show result tag
    const resultEl = document.getElementById(`quiz-result-${questionIndex}`);
    if (resultEl) {
      resultEl.className = "quiz-result-tag " + (isCorrect ? "right" : "wrong");
      resultEl.textContent = isCorrect ? "CORRECT" : "INCORRECT";
    }

    // POST result to backend
    fetch("/api/quiz-result", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({
        class_id: currentQuizClassId,
        topic: currentQuizTopic,
        question_text: q.question,
        selected_answer: selectedLetter,
        correct_answer: correctAnswer,
        is_correct: isCorrect
      })
    }).catch(err => console.error("Failed to save quiz result:", err));
  }

  document.getElementById("questionForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const user=document.getElementById("user").value, text=textArea.value, class_id=classSelect.value;
    if (!class_id) { setStatus("select a class first","pending"); return; }
    aiAnswerDiv.classList.remove("visible"); recommendationsDiv.classList.remove("visible"); quizContainer.classList.remove("visible");
    setStatus("thinking…","pending");
    try {
      const res = await fetch("/api/ask",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({user,text,class_id})});
      const data = await res.json();
      if (res.ok) {
        setStatus("answer ready","ok");
        if (data.slide_recommendation) displayRecommendations(data.slide_recommendation);
        if (data.rag_response) {
          let md = data.rag_response.replace(/\[URGENT\]/gi,'<span class="urgent">[URGENT]</span>');
          document.getElementById("aiTimestamp").textContent = "// " + new Date().toLocaleTimeString();
          aiAnswerText.innerHTML = marked.parse(md);
          aiAnswerDiv.classList.add("visible");
        }
      } else { setStatus("error: "+(data.detail||"unknown"),"err"); }
    } catch(err) { setStatus("network error: "+err.message,"err"); }
  });

  document.getElementById("generateQuizBtn").addEventListener("click", async () => {
    const user=document.getElementById("user").value, text=textArea.value, difficulty=document.getElementById("difficulty").value, class_id=classSelect.value;
    if (!class_id) { setStatus("select a class first","pending"); return; }
    if (!difficulty) { setStatus("select a difficulty first","pending"); return; }
    recommendationsDiv.classList.remove("visible"); quizContainer.classList.remove("visible"); aiAnswerDiv.classList.remove("visible");
    setStatus("generating quiz…","pending");
    try {
      const res = await fetch("/api/generate-quiz",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({user,text,difficulty,class_id})});
      const data = await res.json();
      if (res.ok && data.questions?.length) {
        setStatus("quiz ready","ok");
        currentQuizTopic = data.topic || text;
        currentQuizClassId = data.class_id || class_id;
        renderQuiz(data.questions);
      }
      else { setStatus(data.detail || "quiz generation failed","err"); }
    } catch(err) { setStatus("network error: "+err.message,"err"); }
  });

  function connectWS() {
    const ws = new WebSocket(`${location.protocol==="https:"?"wss":"ws"}://${location.host}/ws`);
    ws.onmessage = (e) => {
      try {
        const msg=JSON.parse(e.data);
        if (msg.event==="quiz") { try{const q=JSON.parse(msg.data);if(q.questions){renderQuiz(q.questions);setStatus("live quiz received","ok");}}catch{} }
      } catch {}
    };
    ws.onclose = () => setTimeout(connectWS,5000);
  }
  connectWS();
</script>
</body>
